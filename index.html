<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLVCK-DOWNLOAD</title>
    <link rel="icon" type="image/x-icon" href="blvckicon.ico">
    
    <!-- Open Graph Meta Tags for Discord Preview -->
    <meta property="og:title" content="BLVCK-DOWNLOAD">
    <meta property="og:description" content="For the homies. enjoy!">
    <meta property="og:image" content="https://blvckdownload-production.up.railway.app/thumbnail.png">
    <meta property="og:url" content="https://blvckdownload-production.up.railway.app">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
 
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
 
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
 
        .logo {
            font-size: 48px;
            margin-bottom: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
 
        .tagline {
            font-size: 16px;
            color: #b0b0b0;
            font-weight: 400;
        }
 
        .card {
            background: #242424;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            border: 1px solid #3a3a3a;
        }
 
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
 
        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border: 1.5px solid #3a3a3a;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: #1a1a1a;
            color: #ffffff;
        }
 
        .input-group input:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
            background: #2a2a2a;
        }
 
        .input-group input::placeholder {
            color: #666666;
        }
 
        .btn-fetch {
            padding: 14px 32px;
            background: #ffffff;
            color: #1a1a1a;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, background 0.25s ease;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
 
        .btn-fetch:hover:not(:disabled) {
            transform: scale(1.06);
            background: #f0f0f0;
            box-shadow: 0 6px 16px rgba(255, 255, 255, 0.3);
        }
 
        .btn-fetch:active:not(:disabled) {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
        }
 
        .btn-fetch:disabled {
            background: #555555;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
 
        .loading {
            text-align: center;
            padding: 30px;
            color: #b0b0b0;
        }
 
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #3a3a3a;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
            vertical-align: middle;
        }
 
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
 
        .video-info {
            display: flex;
            gap: 16px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1.5px solid #3a3a3a;
        }
 
        .thumbnail {
            width: 120px;
            height: 68px;
            border-radius: 8px;
            object-fit: cover;
            background: #3a3a3a;
            flex-shrink: 0;
        }
 
        .video-details {
            flex: 1;
        }
 
        .video-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-clamp: 2;
        }
 
        .video-meta {
            font-size: 13px;
            color: #888888;
        }
 
        .format-section {
            margin-bottom: 30px;
        }
 
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
 
        .format-toggle {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
 
        .toggle-btn {
            flex: 1;
            padding: 12px 16px;
            border: 1.5px solid #3a3a3a;
            border-radius: 12px;
            background: #1a1a1a;
            color: #b0b0b0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
        }
 
        .toggle-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
            border-color: #555555;
        }
 
        .toggle-btn:active {
            transform: scale(0.96);
        }
 
        .toggle-btn.active {
            background: #ffffff;
            color: #1a1a1a;
            border-color: #ffffff;
        }
 
        .dropdown-container {
            position: relative;
            width: 100%;
        }
 
        .dropdown-button {
            width: 100%;
            padding: 14px 16px;
            background: #1a1a1a;
            color: #b0b0b0;
            border: 1.5px solid #3a3a3a;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
 
        .dropdown-button:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
            border-color: #555555;
        }
 
        .dropdown-button:active {
            transform: scale(0.98);
        }
 
        .dropdown-button.open {
            border-color: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
        }
 
        .dropdown-arrow {
            transition: transform 0.25s ease;
            font-size: 12px;
            color: #b0b0b0;
        }
 
        .dropdown-button.open .dropdown-arrow {
            transform: rotate(180deg);
        }
 
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #1a1a1a;
            border: 1.5px solid #3a3a3a;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
 
        .dropdown-menu.open {
            max-height: 400px;
        }
 
        .dropdown-item {
            padding: 14px 16px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #b0b0b0;
            font-size: 14px;
        }
 
        .dropdown-item:last-child {
            border-bottom: none;
        }
 
        .dropdown-item:hover {
            background: #2a2a2a;
            color: #ffffff;
        }
 
        .dropdown-item.selected {
            background: #2a2a2a;
            color: #ffffff;
            font-weight: 600;
        }
 
        .item-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
 
        .item-size {
            font-size: 12px;
            color: #666666;
        }
 
        .checkmark {
            color: #ffffff;
            font-weight: 600;
        }
 
        .download-button {
            width: 100%;
            padding: 14px 16px;
            background: #ffffff;
            color: #1a1a1a;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
 
        .download-button:hover:not(:disabled) {
            transform: scale(1.06);
            background: #f0f0f0;
            box-shadow: 0 6px 16px rgba(255, 255, 255, 0.3);
        }
 
        .download-button:active:not(:disabled) {
            transform: scale(0.96);
        }
 
        .download-button:disabled {
            background: #555555;
            cursor: not-allowed;
            transform: none;
        }
 
        .progress-bar-container {
            margin-top: 16px;
            display: none;
        }
 
        .progress-bar-container.show {
            display: block;
        }
 
        .progress-label {
            font-size: 13px;
            color: #b0b0b0;
            margin-bottom: 8px;
        }
 
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #2a2a2a;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #3a3a3a;
        }
 
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffffff 0%, #b0b0b0 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
 
        .error {
            background: #1a1a1a;
            border: 1.5px solid #ff4444;
            color: #ff6666;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
        }
 
        .success {
            background: #1a1a1a;
            border: 1.5px solid #44aa44;
            color: #66dd66;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
        }
 
        .empty {
            text-align: center;
            color: #666666;
            font-size: 15px;
            padding: 40px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">BLVCK-DOWNLOAD</div>
            <div class="tagline">Download videos and audio instantly</div>
        </div>
 
        <div class="card">
            <div class="input-group">
                <input 
                    type="text" 
                    id="urlInput" 
                    placeholder="Paste URL here..." 
                    oninput="onUrlInput()"
                >
                <button class="btn-fetch" onclick="fetchVideo()" id="fetchBtn">Download</button>
            </div>
 
            <div id="content"></div>
        </div>
    </div>
 
    <script>
        // Configuration - UPDATE THIS WITH YOUR RENDER BACKEND URL
        const API_URL = 'https://blvckdownload-production.up.railway.app';
 
        let currentVideo = null;
        let selectedFormat = 'mp4';
        let selectedResolution = null;
        let fetchTimeout = null;
        let isDownloading = false;
 
        /**
         * Auto-fetch when URL is pasted (with debounce)
         */
        function onUrlInput() {
            const url = document.getElementById('urlInput').value.trim();
            
            clearTimeout(fetchTimeout);
            
            if (url.length > 10) {
                document.getElementById('content').innerHTML = '<div class="loading"><span class="spinner"></span> Loading video...</div>';
                fetchTimeout = setTimeout(() => {
                    fetchVideo();
                }, 1000);
            }
        }
 
        /**
         * Fetch video information from backend
         */
        async function fetchVideo() {
            const url = document.getElementById('urlInput').value.trim();
            const contentDiv = document.getElementById('content');
            const fetchBtn = document.getElementById('fetchBtn');
 
            if (!url) {
                contentDiv.innerHTML = '<div class="error">Please enter a video URL</div>';
                return;
            }
 
            fetchBtn.disabled = true;
            contentDiv.innerHTML = '<div class="loading"><span class="spinner"></span> Analyzing video...</div>';
 
            try {
                const response = await fetch(`${API_URL}/api/video-info?url=${encodeURIComponent(url)}`);
                
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Failed to fetch video info');
                }
 
                const videoData = await response.json();
                currentVideo = videoData;
                selectedFormat = 'mp4';
                selectedResolution = null;
                
                renderContent();
            } catch (error) {
                console.error('Error:', error);
                contentDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            } finally {
                fetchBtn.disabled = false;
            }
        }
 
        /**
         * Toggle dropdown menu
         */
        function toggleDropdown(id) {
            const menu = document.getElementById(id);
            const btn = menu.previousElementSibling;
            menu.classList.toggle('open');
            btn.classList.toggle('open');
        }
 
        /**
         * Select resolution from dropdown
         */
        function selectResolution(id, quality, size) {
            selectedResolution = { quality, size };
            
            const items = document.querySelectorAll(`#${id} .dropdown-item`);
            items.forEach(item => item.classList.remove('selected'));
            
            event.target.closest('.dropdown-item').classList.add('selected');
            
            const btn = document.getElementById(`btn-${id}`);
            btn.textContent = `${quality} (${size})`;
            btn.querySelector('.dropdown-arrow').textContent = '▼';
            
            document.getElementById(id).classList.remove('open');
            btn.classList.remove('open');
        }
 
        /**
         * Switch between MP4 and MP3 formats
         */
        function switchFormat(format) {
            selectedFormat = format;
            selectedResolution = null;
            
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderContent();
        }
 
        /**
         * Render content after fetching video info
         */
        function renderContent() {
            if (!currentVideo) {
                document.getElementById('content').innerHTML = '<div class="empty">Paste a URL to get started</div>';
                return;
            }
 
            const contentDiv = document.getElementById('content');
            
            let html = `
                <div class="video-info">
                    <img src="${currentVideo.thumbnail}" alt="Thumbnail" class="thumbnail">
                    <div class="video-details">
                        <div class="video-title">${currentVideo.title}</div>
                        <div class="video-meta">${currentVideo.channel} • ${formatDuration(currentVideo.duration)}</div>
                    </div>
                </div>
 
                <div class="format-section">
                    <div class="section-title">Format</div>
                    <div class="format-toggle">
                        <button class="toggle-btn ${selectedFormat === 'mp4' ? 'active' : ''}" onclick="switchFormat('mp4')">
                            Video (MP4)
                        </button>
                        <button class="toggle-btn ${selectedFormat === 'mp3' ? 'active' : ''}" onclick="switchFormat('mp3')">
                            Audio (MP3)
                        </button>
                    </div>
                </div>
 
                <div class="format-section">
                    <div class="section-title">Quality</div>
                    <div class="dropdown-container">
                        <button class="dropdown-button" onclick="toggleDropdown('resolution-dropdown')" id="btn-resolution-dropdown">
                            <span>Select quality</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="dropdown-menu" id="resolution-dropdown">
            `;
 
            const formats = selectedFormat === 'mp4' ? currentVideo.formats.mp4 : currentVideo.formats.mp3;
            
            formats.forEach((fmt, idx) => {
                const selected = selectedResolution && selectedResolution.quality === fmt.quality ? 'selected' : '';
                html += `
                    <div class="dropdown-item ${selected}" onclick="selectResolution('resolution-dropdown', '${fmt.quality}', '${fmt.size}')">
                        <div class="item-details">
                            <span>${fmt.quality}</span>
                            <span class="item-size">${fmt.size}</span>
                        </div>
                        ${selected ? '<span class="checkmark">✓</span>' : ''}
                    </div>
                `;
            });
 
            html += `
                        </div>
                    </div>
                </div>
 
                <button class="download-button" onclick="startDownload()">
                    ⬇️ Download Now
                </button>
 
                <div class="progress-bar-container" id="progressContainer">
                    <div class="progress-label">
                        Downloading... <span id="progressPercent">0</span>%
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            `;
 
            contentDiv.innerHTML = html;
        }
 
        /**
         * Start the download
         */
        async function startDownload() {
            if (!selectedResolution || !currentVideo) {
                alert('Please select a quality first');
                return;
            }
 
            if (isDownloading) return;
 
            const btn = document.querySelector('.download-button');
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressPercent = document.getElementById('progressPercent');
 
            btn.disabled = true;
            isDownloading = true;
            progressContainer.classList.add('show');
            progressFill.style.width = '0%';
            progressPercent.textContent = '0';
 
            try {
                const response = await fetch(`${API_URL}/api/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: document.getElementById('urlInput').value,
                        format: selectedFormat,
                        quality: selectedResolution.quality
                    })
                });
 
                const data = await response.json();
 
                if (!response.ok) {
                    throw new Error(data.error || 'Download failed');
                }
 
                // Simulate progress completion
                for (let i = progressFill.offsetWidth; i < 100; i += 10) {
                    progressFill.style.width = (i + Math.random() * 5) + '%';
                    progressPercent.textContent = Math.floor(parseFloat(progressFill.style.width));
                    await new Promise(r => setTimeout(r, 100));
                }
 
                progressFill.style.width = '100%';
                progressPercent.textContent = '100';
 
                // Show success message
                const contentDiv = document.getElementById('content');
                const successMsg = document.createElement('div');
                successMsg.className = 'success';
                successMsg.innerHTML = `✓ Download complete! File: ${data.filename} (${data.size})`;
                contentDiv.insertBefore(successMsg, contentDiv.firstChild);
 
                // Trigger download
                const link = document.createElement('a');
                link.href = `${API_URL}${data.downloadUrl}`;
                link.download = data.filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
 
                setTimeout(() => {
                    progressContainer.classList.remove('show');
                    btn.disabled = false;
                    isDownloading = false;
                }, 2000);
 
            } catch (error) {
                console.error('Download error:', error);
                const contentDiv = document.getElementById('content');
                const errorMsg = document.createElement('div');
                errorMsg.className = 'error';
                errorMsg.innerHTML = `❌ Error: ${error.message}`;
                contentDiv.insertBefore(errorMsg, contentDiv.firstChild);
 
                progressContainer.classList.remove('show');
                btn.disabled = false;
                isDownloading = false;
            }
        }
 
        /**
         * Format duration in seconds to readable format
         */
        function formatDuration(seconds) {
            if (!seconds) return 'Unknown';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hours > 0) {
                return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }
            return `${minutes}:${String(secs).padStart(2, '0')}`;
        }
 
        // Initialize
        document.getElementById('content').innerHTML = '<div class="empty">Paste a URL to get started</div>';
    </script>
</body>
</html>
